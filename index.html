<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2C2C2C" />
    <meta
      name="description"
      content="HostelHub — Smart Hostel Management System"
    />
    <title>HostelHub · Campus, connected</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("hostelhub-theme") === "light"
            ? "light"
            : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
